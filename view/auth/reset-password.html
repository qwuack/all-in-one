<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #007bff;
            border: none;
            color: white;
            cursor: pointer;
        }

        .message {
            margin-top: 10px;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            font-size: 13px;
        }
        .message.show {
            max-height: 100px;
            opacity: 1;
            padding: 10px 0;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Reset Password</h2>

        <input type="password" id="password" placeholder="New Password">

        <input type="password" id="confirmPassword" placeholder="Confirm Password">

        <div
            style="font-size: 0.8rem; color: #666; margin-top: 10px; line-height: 1.4; padding: 10px; border-radius: 4px; border-left: 3px solid #007bff;">
            Password Requirements:<br />
            • Minimum 8 characters<br />
            • At least one uppercase & one lowercase letter<br />
            • At least one numeric digit<br />
            • At least one special character
        </div>

        <button onclick="resetPassword()">Reset Password</button>

        <div class="message" id="message"></div>

    </div>

    <script>

        // Get email and token from URL
        const params = new URLSearchParams(window.location.search)
        const email = params.get("email")
        const key = params.get("key")

        async function resetPassword() {

            const password = document.getElementById("password").value
            const confirm = document.getElementById("confirmPassword").value
            const message = document.getElementById("message")
            // const configRes = await fetch(
            //     "https://qwuack.github.io/all-in-one/tunnel-config.json"
            // )
            // const config = await configRes.json()
            // const API = config.api
            const API = "https://carbon-radar-thereby-organ.trycloudflare.com";

            const isStrongPassword = (pw) => {
                return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/.test(pw);
            };

            if (password !== confirm) {
                message.innerText = "Passwords does not match"
                message.style.color = "red"
                return
            }

            if (!isStrongPassword(password)) {
                message.innerText = "Password is too weak. It must be at least 8 characters long and include uppercase, lowercase, numbers, and symbols."
                message.style.color = "red"
                return
            }

            try {
                const response = await fetch(API + "/api/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        key: key,
                        newPassword: password
                    })
                })

                const result = await response.json()

                if (result.success) {
                    message.innerText = "Password reset successful!"
                    message.style.color = "green"
                    message.classList.add('show')
                } else {
                    message.innerText = result.message
                    message.style.color = "red"
                    message.classList.add('show')
                }

            } catch (err) {
                message.innerText = "Server error"
                message.classList.add('show')
            }
        }

    </script>

</body>

</html>
