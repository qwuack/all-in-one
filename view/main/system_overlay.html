<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Overlay</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: none; /* Hidden by default */
        }

        /* Override loading overlay to be relative to this view's viewport */
        .loading-overlay {
            position: absolute;
            background: rgba(0, 0, 0, 0.4); /* Slightly lighter background to see behind */
        }

        /* Ensure modals are centered */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-dialog {
            background: var(--bg-card);
            border: 1px solid var(--bd-1);
            border-radius: var(--r-xl);
            box-shadow: var(--sh-xl);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            animation: modal-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modal-in {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: var(--s5) var(--s6);
            border-bottom: 1px solid var(--bd-0);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-family: var(--f-disp);
            font-size: 18px;
            font-weight: 700;
            color: var(--tx-1);
        }

        .modal-body {
            padding: var(--s6);
        }

        .modal-footer {
            padding: var(--s4) var(--s6);
            background: rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: flex-end;
            gap: var(--s3);
        }

        .btn-modal {
            padding: 8px 18px;
            border-radius: var(--r-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--t-b);
            border: none;
        }

        .btn-modal-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-modal-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-modal-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--tx-2);
        }

        .btn-modal-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--tx-1);
        }
        
        /* Modal specific inputs */
        .modal-input-group {
            margin-bottom: var(--s4);
        }
        .modal-input-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--tx-3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .modal-input {
            width: 100%;
            height: 42px;
            background: var(--bg-input);
            border: 1px solid var(--bd-1);
            border-radius: var(--r-md);
            padding: 0 var(--s4);
            color: var(--tx-1);
            font-family: var(--f-body);
            font-size: 14px;
            outline: none;
            transition: all var(--t-b);
        }
        .modal-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .modal-error {
            color: var(--err);
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- 1. Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p class="loading-text" id="loading-text">Loading...</p>
        </div>
    </div>

    <!-- 2. Modal Overlay (for Confirm & Dialogs) -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">System Action</h2>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content will be injected here -->
            </div>
            <div class="modal-footer" id="modal-footer">
                <button id="modal-cancel" class="btn-modal btn-modal-secondary">Cancel</button>
                <button id="modal-confirm" class="btn-modal btn-modal-primary">Confirm</button>
            </div>
        </div>
    </div>

    <script src="../../js/i18n.js"></script>
    <script>
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalConfirm = document.getElementById('modal-confirm');
        const modalCancel = document.getElementById('modal-cancel');

        let currentOverlayType = null;

        // Apply initial language
        const updateLang = () => {
            if (window.i18n) {
                const lang = localStorage.getItem('all-in-one-language') || 'en';
                window.i18n.setLanguage(lang);
            }
        };
        updateLang();

        window.electronAPI.onShowSystemOverlay((options) => {
            updateLang();
            const { type, text, title, description, showCancel = true, confirmText, cancelText, 
                    fields = [] // [{id, label, type, placeholder, value}]
                  } = options;
            
            currentOverlayType = type;
            document.body.style.display = 'flex';

            if (type === 'loading') {
                loadingOverlay.style.display = 'flex';
                modalOverlay.style.display = 'none';
                loadingText.textContent = text || (window.i18n ? window.i18n.t('loading') : 'Loading...');
            } else if (type === 'confirm' || type === 'modal') {
                loadingOverlay.style.display = 'none';
                modalOverlay.style.display = 'flex';
                modalTitle.textContent = title || 'Confirm';
                
                modalBody.innerHTML = '';
                if (description) {
                   const desc = document.createElement('p');
                   desc.style.marginBottom = '15px';
                   desc.style.fontSize = '13px';
                   desc.style.color = 'var(--tx-3)';
                   desc.textContent = description;
                   modalBody.appendChild(desc);
                }
                
                if (fields && fields.length > 0) {
                    fields.forEach(f => {
                        const group = document.createElement('div');
                        group.className = 'modal-input-group';
                        group.innerHTML = `
                            <label class="modal-input-label">${f.label}</label>
                            <input type="${f.type || 'text'}" class="modal-input" id="field-${f.id}" placeholder="${f.placeholder || ''}" value="${f.value || ''}">
                        `;
                        modalBody.appendChild(group);

                        if (f.type === 'tel') {
                            const inputEl = group.querySelector(`#field-${f.id}`);
                            if (inputEl) {
                                inputEl.addEventListener('input', function() {
                                    this.value = this.value.replace(/\D/g, '');
                                });
                            }
                        }
                    });
                } else if (text) {
                    const p = document.createElement('p');
                    p.textContent = text;
                    modalBody.appendChild(p);
                }

                const errorDiv = document.createElement('div');
                errorDiv.id = 'modal-error';
                errorDiv.className = 'modal-error';
                modalBody.appendChild(errorDiv);

                modalCancel.style.display = showCancel ? 'block' : 'none';
                modalConfirm.textContent = confirmText || (window.i18n ? window.i18n.t('confirmBtn') : 'Confirm');
                modalCancel.textContent = cancelText || (window.i18n ? window.i18n.t('cancelBtn') : 'Cancel');
                
                // Focus first input if any
                const firstInput = modalBody.querySelector('input');
                if (firstInput) firstInput.focus();
                else modalConfirm.focus();
            }
        });

        window.electronAPI.onHideSystemOverlay(() => {
            document.body.style.display = 'none';
            loadingOverlay.style.display = 'none';
            modalOverlay.style.display = 'none';
            currentOverlayType = null;
        });

        modalConfirm.addEventListener('click', () => {
            const results = {};
            modalBody.querySelectorAll('input').forEach(input => {
                results[input.id.replace('field-', '')] = input.value;
            });
            window.electronAPI.sendSystemOverlayResponse({ confirmed: true, results });
        });

        modalCancel.addEventListener('click', () => {
            window.electronAPI.sendSystemOverlayResponse({ confirmed: false });
        });
        
        // Handle input events in the modal if needed
        modalBody.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                modalConfirm.click();
            } else if (e.key === 'Escape') {
                modalCancel.click();
            }
        });
    </script>
</body>
</html>
